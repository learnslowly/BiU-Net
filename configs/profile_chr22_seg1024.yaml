# 5-epoch profiling run to identify I/O vs compute bottleneck.

runId: profile_chr22
dataset: 1KGP
chromosome: 22
chromosomes: [22]
segLen: 1024
overlap: 128
population: ALL

model: unet
bioAware: True
depth: 6
nchannels: 32
kernelSize: 7
stride: 1
dropoutRate: 0.0

batchSize: 256
learningRate: 0.00226
loss: hybridWeightedFocalLoss
dosageLossLambda: 0.5
focalAlpha: 0.25
focalGamma: 2.0
sampling: normal
missingRatio: 0.5
dynamicRatio: True
bertStrategy: False
benchmarkAll: False

mixedPrecisionTraining: True
useTorchCompile: True
torchCompileMode: reduce-overhead
enableProfiling: True
maxProfilingBatches: 20
saveCheckpointFreq: 5
valFreq: 5
valSubsetFraction: 0.5
useWandB: False
finetuning: False

totalEpochs: 5
warmupEpochs: 1
cooldownEpochs: 0
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42

bins: [0.0, 0.005, 0.01, 0.05, 0.40, 0.5]

batchSizeTest: 8
epoch: 0
