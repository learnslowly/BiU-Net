# Eval config for ablation A2 epoch 30.

runId: ablation_a2
dataset: 1KGP
chromosome: 22
segLen: 1024
overlap: 128
population: ALL

model: unet
bioAware: True
depth: 6
nchannels: 32
kernelSize: 7
stride: 1
dropoutRate: 0.0

batchSize: 128
batchSizeTest: 8
learningRate: 0.0016
loss: hybridWeightedFocalLoss
focalAlpha: 0.25
focalGamma: 2.0
dosageLossLambda: 0.5
sampling: normal

useWandB: False
finetuning: False
totalEpochs: 30
warmupEpochs: 3
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42
missingRatio: 0.5
dynamicRatio: True
bertStrategy: False

benchmarkAll: False
epoch: 30
bins: [0.0, 0.005, 0.01, 0.05, 0.40, 0.5]
missing: [0.5]
testRandStates: [42]
