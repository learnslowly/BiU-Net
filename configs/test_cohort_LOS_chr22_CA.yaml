# Cohort-specific model for the Caucasian cohort of the LOS dataset, chromosome 22, at
# checkpoint epoch 66.
runId: FT_UNET_CA
dataset: LOS
chromosome: 22
chromosomes: [22]
segLen: 128
overlap: 16
population: CA
model: unet
bioAware: True
batchSize: 512
batchSizeTest: 512
dropoutRate: 0.0
learningRate: 0.001
loss: hybridWeightedFocalLoss
sampling: normal
upsamplingRatio: 0.8
totalEpochs: 800
warmupEpochs: 10
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 0
missingRatio: 0.8
dynamicRatio: False
bertStrategy: False
useWandB: False
benchmarkAll: True
epoch: 66
bins: [0.001, 0.005, 0.010, 0.100, 0.200, 0.300, 0.400, 0.500]
missing: [0.05, 0.15, 0.25]
testRandStates: [0, 42, 1024]
