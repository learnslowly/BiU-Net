# Array-to-WGS fine-tuning of the genome-wide merged-data model, chromosome 19.
runId: v3low_chipft
dataset: 1KGP
chromosome: 19
chromosomes: [19]
segLen: 1024
overlap: 128
population: ALL
model: unet
bioAware: True
depth: 6
nchannels: 48
kernelSize: 7
stride: 1
dropoutRate: 0.05
useGroupNorm: False
batchSize: 256
learningRate: 0.0001
loss: hybridWeightedFocalLoss
dosageLossLambda: 0.5
focalAlpha: 0.25
focalGamma: 2.0
sampling: normal
missingRatio: 0.95
dynamicRatio: False
bertStrategy: False
benchmarkAll: True
trainOnVal: True
mixedPrecisionTraining: True
preloadData: True
useTorchCompile: True
torchCompileMode: reduce-overhead
saveCheckpointFreq: 5
valFreq: 5
valSubsetFraction: 0.05
useWandB: False
finetuning: False
totalEpochs: 30
warmupEpochs: 0
cooldownEpochs: 0
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42
earlyStoppingPatience: 999    # fixed schedule; val is in-training under trainOnVal
earlyStoppingMinDelta: 0.0
curriculumStartRatio: -1.0    # no curriculum: the genome-wide run already annealed
curriculumWarmupEpochs: 0
bins: [0.0, 0.005, 0.01, 0.05, 0.40, 0.5]
batchSizeTest: 8
epoch: 0
maskMode: colwise
colwiseDynamicRange: True
colwiseRateMin: 0.85
colwiseMafMin: 0.05
