# Array-to-WGS evaluation of the array-adapted model, chromosome 16.
runId: v3low_chipft
dataset: 1KGP
chromosome: 16
chromosomes: [16]
segLen: 1024
overlap: 128
population: ALL
model: unet
bioAware: True
depth: 6
nchannels: 48
kernelSize: 7
stride: 1
dropoutRate: 0.05
useGroupNorm: False
batchSize: 256
learningRate: 0.0001
loss: hybridWeightedFocalLoss
dosageLossLambda: 0.5
focalAlpha: 0.25
focalGamma: 2.0
sampling: normal
missingRatio: 0.30            # final target, matches the 5/15/25% test regime
dynamicRatio: True
bertStrategy: False
benchmarkAll: False
trainOnVal: True
mixedPrecisionTraining: True
preloadData: True
useTorchCompile: True
torchCompileMode: reduce-overhead
saveCheckpointFreq: 5
valFreq: 5
valSubsetFraction: 0.05
useWandB: False
finetuning: False
totalEpochs: 30
warmupEpochs: 0
cooldownEpochs: 0
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42
earlyStoppingPatience: 999    # fixed schedule; val is in-training under trainOnVal
earlyStoppingMinDelta: 0.0
curriculumStartRatio: -1.0    # no curriculum: the genome-wide run already annealed
curriculumWarmupEpochs: 0
bins: [0.001, 0.005, 0.010, 0.100, 0.200, 0.300, 0.400, 0.500]
batchSizeTest: 8
epoch: 30
missing: [0.9]
perVariantR2: False
testRandStates: [2000]
