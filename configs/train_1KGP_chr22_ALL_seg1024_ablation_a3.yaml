bertStrategy: False
benchmarkAll: False

mixedPrecisionTraining: True
saveCheckpointFreq: 5
valFreq: 2
useWandB: False
finetuning: False

totalEpochs: 30
warmupEpochs: 3
cooldownEpochs: 0
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42

bins: [0.0, 0.005, 0.01, 0.05, 0.40, 0.5]

batchSizeTest: 8
epoch: 0
