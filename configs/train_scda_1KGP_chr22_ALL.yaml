# SCDA baseline on chromosome 22 of the 1000 Genomes Project, trained on full-length
# sequences.
runId: exp1_scda
dataset: 1KGP
chromosome: 22
chromosomes: [22]
segLen: -1
overlap: 0
population: ALL
model: scda
bioAware: False
nchannels: 32
dropoutRate: 0.0
batchSize: 512
batchSizeTest: 512
learningRate: 0.00072
loss: focalLoss
sampling: normal
upsamplingRatio: 0.8
useWandB: False
finetuning: False
totalEpochs: 1000
warmupEpochs: 5
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 1024
missingRatio: 0.15
dynamicRatio: False
bertStrategy: False
benchmarkAll: True
bins: [0.001, 0.005, 0.010, 0.100, 0.200, 0.300, 0.400, 0.500]
missing: [0.05, 0.15, 0.25]
testRandStates: [0, 42, 1024]
epoch: 0
