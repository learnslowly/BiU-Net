# Array-to-WGS evaluation of the sporadically-trained per-chromosome model, chromosome
# 17.
runId: ft_sgdp_ftchr
dataset: SGDP
chromosome: 17
chromosomes: [17]
segLen: 1024
overlap: 128
population: ALL
model: unet
bioAware: True
depth: 6
nchannels: 48
kernelSize: 7
stride: 1
dropoutRate: 0.05
useGroupNorm: False
batchSize: 256
learningRate: 0.0001
loss: hybridWeightedFocalLoss
dosageLossLambda: 0.5
focalAlpha: 0.25
focalGamma: 2.0
sampling: normal
missingRatio: 0.30
dynamicRatio: True
bertStrategy: False
benchmarkAll: False
trainOnVal: False
preloadData: True
extraTrainFiles: ./res/SGDP_chr17_ALLPANEL_train_chunk000_seg1024_overlap128.hdf5
mixedPrecisionTraining: True
useTorchCompile: True
torchCompileMode: reduce-overhead
saveCheckpointFreq: 5
valFreq: 5
valSubsetFraction: 0.5
useWandB: False
finetuning: False
totalEpochs: 30
warmupEpochs: 0
cooldownEpochs: 0
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42
earlyStoppingPatience: 10
earlyStoppingMinDelta: 0.0001
curriculumStartRatio: -1.0    # no curriculum: it already ran in the genome-wide phase
curriculumWarmupEpochs: 0
bins: [0.001, 0.005, 0.010, 0.100, 0.200, 0.300, 0.400, 0.500]
batchSizeTest: 8
epoch: best
missing: [0.9]
perVariantR2: False
testRandStates: [2000]
