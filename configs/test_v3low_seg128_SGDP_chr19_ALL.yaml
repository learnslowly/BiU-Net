# SGDP chr19 benchmark config, phased per-variant r2 (BAT), all 4 missing levels x 3
# random states.
runId: v3_low_seg128
dataset: SGDP
chromosome: 19
chromosomes: [19]
segLen: 128
overlap: 16
population: ALL
model: unet
bioAware: True
depth: 6
nchannels: 48
kernelSize: 7
stride: 1
dropoutRate: 0.05
useGroupNorm: False
batchSize: 256
batchSizeTest: 8
learningRate: 0.0005
loss: hybridWeightedFocalLoss
dosageLossLambda: 0.5
focalAlpha: 0.25
focalGamma: 2.0
sampling: normal
useWandB: False
finetuning: False
totalEpochs: 700
warmupEpochs: 10
scheduler: cosineAnn
adamwBeta1: 0.9
adamwBeta2: 0.99
adamwEps: 0.00000001
adamwWeightDecay: 0.01
seed: 42
missingRatio: 0.30
dynamicRatio: True
bertStrategy: False
benchmarkAll: True        # BAT: score all positions (original manuscript setting)
perVariantR2: False       # POOLED phased r2 (original manuscript), NOT revision per-variant
epoch: best               # matches checkpoint_..._epoch_best.pth (early-stopped @ ep470)
bins: [0.001, 0.005, 0.010, 0.100, 0.200, 0.300, 0.400, 0.500]
missing: [0.05, 0.15, 0.25]   # 50% omitted -- not reported in the manuscript
testRandStates: [0, 42, 1024]
